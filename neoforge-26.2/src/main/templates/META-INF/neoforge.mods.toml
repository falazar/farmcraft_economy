license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description="Falazar's FarmUpCraft"

[[mixins]]
config="farmupcraft.mixins.json"

[[dependencies.${mod_id}]]
modId="solonion"
type="optional"
versionRange="[0,)"
ordering="BEFORE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},26.3)"
# Recipe overrides must take precedence over NeoForge's compatibility recipes.
ordering="AFTER"
side="BOTH"

# Content integrations are optional; when present their supported versions still apply.
[[dependencies.${mod_id}]]
modId="pamhc2foodcore"
type="optional"
versionRange="[1.0.0]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="pamhc2crops"
type="optional"
versionRange="[1.0.0]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="pamhc2foodextended"
type="optional"
versionRange="[1.0.0]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="pamhc2trees"
type="optional"
versionRange="[1.0.0]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="biomesoplenty"
type="optional"
versionRange="[26.2.0.0.28,26.3)"
ordering="AFTER"
side="BOTH"

# Declare these explicitly rather than relying on legacy required=true metadata
# in the pinned Biomes O' Plenty jar.
[[dependencies.${mod_id}]]
modId="terrablender"
type="optional"
versionRange="[26.2.0.0.2,26.3)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="glitchcore"
type="optional"
versionRange="[26.2.0.0.0,26.3)"
ordering="AFTER"
side="BOTH"

# Data-only overrides must load after Pipez, but do not require it.
[[dependencies.${mod_id}]]
modId="pipez"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Client payload handlers guard these integrations with ModList checks.
[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[30.48.0.244,31)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="journeymap"
type="optional"
versionRange="[26.2-6.0.10,26.3)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
