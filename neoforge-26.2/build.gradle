plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

evaluationDependsOn(':common')

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    networkTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    persistenceTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    visualTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'info.journeymap'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom localRuntime
    networkTestImplementation.extendsFrom implementation
    networkTestCompileOnly.extendsFrom compileOnly
    networkTestRuntimeOnly.extendsFrom localRuntime
    persistenceTestImplementation.extendsFrom implementation
    persistenceTestCompileOnly.extendsFrom compileOnly
    persistenceTestRuntimeOnly.extendsFrom localRuntime
    visualTestImplementation.extendsFrom implementation
    visualTestCompileOnly.extendsFrom compileOnly
    visualTestRuntimeOnly.extendsFrom localRuntime
}

sourceSets.test.java.srcDir('src/networkTest/test')
sourceSets.test.compileClasspath += sourceSets.networkTest.output
sourceSets.test.runtimeClasspath += sourceSets.networkTest.output

dependencies {
    implementation project(':common')
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"

    localRuntime "maven.modrinth:jei:${jei_modrinth_version}"
    localRuntime "maven.modrinth:the-one-probe:${top_modrinth_version}"
    localRuntime "maven.modrinth:journeymap:${journeymap_modrinth_version}"
    localRuntime "maven.modrinth:villager-names-serilum:${villagernames_modrinth_version}"
    localRuntime "maven.modrinth:collective:${collective_modrinth_version}"

    if (providers.gradleProperty('withPipez').map { it.toBoolean() }.getOrElse(false)) {
        localRuntime "maven.modrinth:pipez:${pipez_modrinth_version}"
    }

    implementation "curse.maven:food-core-372534:${harvestcraft_foodcore_file}"
    implementation "curse.maven:crops-361385:${harvestcraft_crops_file}"
    implementation "curse.maven:food-extended-402231:${harvestcraft_foodextended_file}"
    implementation "curse.maven:trees-365460:${harvestcraft_trees_file}"
    implementation "maven.modrinth:HXF82T3G:${bop_modrinth_version}"
    implementation "maven.modrinth:kkmrDlKT:${terrablender_modrinth_version}"
    implementation "maven.modrinth:s3dmwKy5:${glitchcore_modrinth_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    testRuntimeOnly "maven.modrinth:jei:${jei_modrinth_version}"
    testImplementation "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
    testImplementation "net.neoforged:testframework:${neo_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        serverData {
            type = 'serverData'
            gameDirectory = layout.buildDirectory.dir('datagen-run')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', layout.buildDirectory.dir('datagen-verification').get().asFile.absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing', file('src/generated/resources').absolutePath
        }

        networkAcceptanceServer {
            server()
            sourceSet = sourceSets.networkTest
            gameDirectory = layout.buildDirectory.dir('network-acceptance/server')
            programArgument '--nogui'
            systemProperty 'farmupcraft.networkAcceptance', 'true'
            systemProperty 'farmupcraft.networkAcceptanceRoot',
                    layout.buildDirectory.dir('network-acceptance').get().asFile.absolutePath
        }

        networkAcceptanceClient {
            client()
            sourceSet = sourceSets.networkTest
            gameDirectory = layout.buildDirectory.dir('network-acceptance/client')
            programArguments.addAll '--username', 'NetworkProbe',
                    '--quickPlayMultiplayer', '127.0.0.1:25576'
            systemProperty 'farmupcraft.networkAcceptance', 'true'
            systemProperty 'farmupcraft.networkAcceptanceRoot',
                    layout.buildDirectory.dir('network-acceptance').get().asFile.absolutePath
        }

        persistenceSeedServer {
            server()
            sourceSet = sourceSets.persistenceTest
            gameDirectory = layout.buildDirectory.dir('persistence-acceptance')
            programArgument '--nogui'
            systemProperty 'farmupcraft.persistence.enabled', 'true'
            systemProperty 'farmupcraft.persistence.root',
                    layout.buildDirectory.dir('persistence-acceptance').get().asFile.absolutePath
            systemProperty 'farmupcraft.persistence.phase', 'seed'
        }

        persistenceVerifyServer {
            server()
            sourceSet = sourceSets.persistenceTest
            gameDirectory = layout.buildDirectory.dir('persistence-acceptance')
            programArgument '--nogui'
            systemProperty 'farmupcraft.persistence.enabled', 'true'
            systemProperty 'farmupcraft.persistence.root',
                    layout.buildDirectory.dir('persistence-acceptance').get().asFile.absolutePath
            systemProperty 'farmupcraft.persistence.phase', 'verify'
        }

        visualAcceptanceServer {
            server()
            sourceSet = sourceSets.visualTest
            gameDirectory = layout.buildDirectory.dir('visual-acceptance/server')
            programArgument '--nogui'
            systemProperty 'farmupcraft.visualAcceptance', 'true'
            systemProperty 'farmupcraft.visualAcceptanceRoot',
                    layout.buildDirectory.dir('visual-acceptance').get().asFile.absolutePath
        }

        visualAcceptanceClient {
            client()
            sourceSet = sourceSets.visualTest
            gameDirectory = layout.buildDirectory.dir('visual-acceptance/client')
            programArguments.addAll '--username', 'VisualProbe',
                    '--quickPlayMultiplayer', '127.0.0.1:25579'
            systemProperty 'farmupcraft.visualAcceptance', 'true'
            systemProperty 'farmupcraft.visualAcceptanceRoot',
                    layout.buildDirectory.dir('visual-acceptance').get().asFile.absolutePath
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = layout.buildDirectory.dir('gameTest')
            programArgument '--universe'
            programArgument 'world'
            programArgument '--tests'
            programArgument providers.gradleProperty('gameTests').getOrElse("${project.mod_id}:*")
            programArgument '--report'
            programArgument layout.buildDirectory.file('gameTest-results.xml').get().asFile.absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
            sourceSet(sourceSets.gameTest)
            sourceSet(sourceSets.networkTest)
            sourceSet(sourceSets.persistenceTest)
            sourceSet(sourceSets.visualTest)
        }
    }

    neoForge.addModdingDependenciesTo(sourceSets.gameTest)
    neoForge.addModdingDependenciesTo(sourceSets.networkTest)
    neoForge.addModdingDependenciesTo(sourceSets.persistenceTest)
    neoForge.addModdingDependenciesTo(sourceSets.visualTest)

    unitTest {
        enable()
        testedMod = mods.getByName(project.mod_id)
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    from project(':common').sourceSets.main.output
}

tasks.named('check').configure {
    dependsOn ':common:check'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
